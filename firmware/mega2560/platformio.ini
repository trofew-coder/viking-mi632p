[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
upload_speed = 115200
upload_flags =
    -P
    /dev/ttyUSB1
; Пин 0/1 (Serial) выгорел — прошивка через загрузчик USB (ttyUSB1)
; Для ISP через Uno: upload_protocol = avrispmark2, пины SPI 50/51/52/53/RESET
