[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
upload_speed = 115200
upload_flags =
    -P
    /dev/ttyUSB1
; USB-UART адаптер (PL2303/CP2102) к Mega Serial3 (пины 14 TX3 / 15 RX3)
; upload_flags = -P /dev/ttyUSB1
; Для ISP через Uno: upload_protocol = avrispmark2, пины SPI 50/51/52/53/RESET
